<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — StreamFlow</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>

<body>
  <div class="auth-page">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="auth-card animate-fade-up">
      <div class="auth-header">
        <div class="auth-logo">
          <span class="dot"></span> StreamFlow
        </div>
        <h2 id="formTitle">ยินดีต้อนรับกลับมา</h2>
        <p id="formSubtitle">เข้าสู่ระบบเพื่อจัดการแดชบอร์ด</p>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" id="emailLabel">อีเมลหรือชื่อผู้ใช้</label>
          <input type="text" id="email" class="form-control" placeholder="you@example.com หรือ admin" required>
        </div>
        <div class="form-group" id="passGroup">
          <label for="password">รหัสผ่าน</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div id="registerFields" style="display: none;">
          <div class="form-group">
            <label for="username">ชื่อผู้ใช้</label>
            <input type="text" id="username" class="form-control" placeholder="ชื่อที่แสดงของคุณ">
          </div>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary w-full btn-lg">เข้าสู่ระบบ</button>
      </form>

      <form id="otpForm" style="display: none;">
        <p class="otp-description">กรอกรหัส 6 หลักที่ส่งไปยังอีเมลของคุณ</p>
        <div class="otp-row">
          <input type="text" class="otp-input" maxlength="1" data-otp="0">
          <input type="text" class="otp-input" maxlength="1" data-otp="1">
          <input type="text" class="otp-input" maxlength="1" data-otp="2">
          <input type="text" class="otp-input" maxlength="1" data-otp="3">
          <input type="text" class="otp-input" maxlength="1" data-otp="4">
          <input type="text" class="otp-input" maxlength="1" data-otp="5">
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg">ยืนยัน</button>
      </form>

      <div class="auth-footer" id="toggleText">
        ยังไม่มีบัญชี? <a href="#" onclick="toggleMode(); return false;">สมัครสมาชิก</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>

</html>
